name: Build ZipDroid
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Descomprimir proyecto
        run: |
          unzip -q -o ZipDroid.zip -d proyecto
          S=$(find proyecto -name settings.gradle.kts -print -quit)
          echo "ROOT=$(dirname "$S")" >> "$GITHUB_ENV"
      - name: Compilar
        working-directory: ${{ env.ROOT }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZipDroid-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
