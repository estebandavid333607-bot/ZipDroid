name: Build APK
run-name: Build ${{ inputs.folder }}

on:
  workflow_dispatch:
    inputs:
      folder:
        description: Carpeta dentro de builds/
        required: true
      task:
        description: Tarea de Gradle
        default: assembleDebug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Descomprimir y localizar el proyecto
        run: |
          mkdir -p work
          unzip -q "builds/${{ inputs.folder }}/project.zip" -d work
          G=$(find work -name gradlew -print -quit)
          [ -n "$G" ] || { echo "No se encontro gradlew en el ZIP"; exit 1; }
          echo "ROOT=$(dirname "$G")" >> "$GITHUB_ENV"

      - name: Compilar
        run: |
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew ${{ inputs.task }} --no-daemon

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find "$ROOT" -path '*outputs/apk/debug/*' -name '*.apk' | head -n1)
          [ -n "$APK" ] || { echo "No se genero ningun APK"; exit 1; }
          cp "$APK" app.apk
          gh release create "build-${{ inputs.folder }}" app.apk \
            --title "Build ${{ inputs.folder }}" --notes ""

      - name: Limpiar el ZIP del repositorio
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git pull -q --rebase || true
          git rm -rq "builds/${{ inputs.folder }}" || true
          git commit -qm "limpiar ${{ inputs.folder }}" && git push || true
